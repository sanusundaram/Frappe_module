<!DOCTYPE html>
<html>
<head>
    <title>Realtime Test</title>
</head>

<body>

    <h1>Realtime Test</h1>

    <input
        type="text"
        id="message"
        placeholder="Enter a message"
    >

    <button onclick="send_message()">
        Send Message
    </button>

    <h2>Received Message:</h2>

    <div id="result"></div>


    <script>

        // Listen for realtime event
        frappe.realtime.on("my_custom_event", function(data) {

            console.log("REALTIME EVENT RECEIVED");
            console.log(data);

            document.getElementById("result").innerText =
                data.message;

        });


        // Send message to Python
        function send_message() {

            const message =
                document.getElementById("message").value;

            frappe.call({

                method: "app1.api.send_realtime_message",

                args: {
                    message: message
                },

                callback: function(response) {

                    console.log("Python API Response:");
                    console.log(response.message);

                }

            });

        }

    </script>

</body>
</html>
